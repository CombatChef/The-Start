<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SlashCo VR Battle</title>
    <meta name="description" content="A turn-based battle based on SlashCo VR: Mel, John, Mysti, Captain Jim and Purpl Lady against Trollge, Sid or Dolphin Man." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="viewport">
      <div id="stage">
        <div id="bg"></div>
        <div id="flicker"></div>

        <div id="enemy-wrap">
          <canvas id="enemy" class="px" width="224" height="210"></canvas>
        </div>

        <!-- SLASHERBOY, the computer in SlashCo's monitor room, prints the battle log. -->
        <div id="slasherboy">
          <div class="bar">
            <span class="sys">SLASHERBOY</span>
            <span class="readout" id="turn-chip">TURN 1</span>
            <span class="readout" id="credits-chip">0 CR</span>
            <span class="readout" id="place-chip"></span>
            <span class="readout" id="chopper-chip" style="display: none">HELI 5</span>
            <span class="gap"></span>
            <button class="key" id="log-btn" title="Battle log (L)">LOG</button>
            <button class="key" id="fast-btn" title="Fast text (F)">FAST</button>
            <button class="key" id="mute-btn" title="Sound (M)">SOUND</button>
          </div>
          <div id="log">
            <div id="log-lines"></div>
            <div class="more"></div>
          </div>
        </div>

        <!-- The slasher's condition, laid out like the in-game HUD. -->
        <div id="foe">
          <div class="name"></div>
          <div class="facts"><span class="cls"></span><span class="dlvl"></span></div>
          <div class="state"></div>
          <div class="anger"></div>
          <div class="tags"></div>
        </div>

        <div id="menu">
          <div id="escape" title="Click for the breakdown"><span class="lbl">ESCAPE ODDS</span><span class="pct">--</span><span class="label"></span></div>
          <div id="command"></div>
        </div>
        <div id="escape-tip"></div>

        <div id="panel"></div>
        <div id="skillcheck"></div>

        <div id="fx"></div>
        <div id="flash"></div>
        <div class="cursor" id="cursor" style="display: none"></div>

        <div class="overlay" id="screen"></div>
        <div class="overlay" id="help"></div>
        <div class="overlay" id="history"></div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/pixel.js"></script>
    <script src="js/images.js"></script>
    <script src="js/art.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/checks.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
