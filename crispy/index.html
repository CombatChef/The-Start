<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crispy vs The Creature</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="scene" width="1280" height="960"></canvas>

        <div id="hud">
          <header id="topbar">
            <div class="recycle" aria-hidden="true">
              <svg viewBox="0 0 32 32"><path d="M16 3l5 8h-3.5l-1.5-2.5L13 14l-3-1.7L16 3zm9.3 14.5l3.5 6.2c.6 1-.2 2.3-1.4 2.3H21v3l-4.5-5 4.5-5v3h5l-3.7-6.4 3-1.7zM6.7 17.5l3 1.7L6 25.6h5v-3l4.5 5-4.5 5v-3H4.6c-1.2 0-2-1.3-1.4-2.3l3.5-6.3z" /></svg>
            </div>
            <div class="dept"><b>DEPT. OF SANITATION</b><span>HOUSEHOLD DIVISION · NIGHT SHIFT</span></div>
            <div class="led" id="round">ROUND 01</div>
            <div class="spacer"></div>
            <button class="knob" id="btn-music" title="Music">MUSIC</button>
            <button class="knob" id="btn-sfx" title="Sound effects">SOUND</button>
          </header>

          <section id="foe">
            <img id="foe-pic" alt="" />
            <div class="foe-info">
              <div class="foe-name"><span id="foe-name">The Creature</span> <span id="foe-tag">(Stage 1)</span></div>
              <div class="foe-state" id="foe-state">[GOOD]</div>
              <div class="timer" id="foe-timer"><span class="dial"></span><span class="tlabel">ADJUST IN</span><b id="foe-turns">3</b></div>
              <div class="tags" id="foe-tags"></div>
            </div>
          </section>

          <section id="console">
            <div id="card">
              <div class="idstrip"><span>SANITATION</span><span>EMPLOYEE ID 0099</span></div>
              <div class="cardbody">
                <div class="vital">
                  <div class="heart" id="heart"></div>
                  <div class="hpword" id="hp-word">[OK]</div>
                </div>
                <div class="stats">
                  <div class="nameline"><b>CRISPY SOTO</b><span>LV 99</span></div>
                  <div class="hpnum" id="hp-num">HP 280/280</div>
                  <div class="spline">
                    <label>SP</label>
                    <div class="tank"><div id="sp-fill"></div></div>
                    <span id="sp-num">100</span>
                  </div>
                  <div class="pilot" id="pilot"><span class="flame"></span><span>PILOT LIGHT</span></div>
                </div>
              </div>
              <div class="tags" id="hero-tags"></div>
            </div>

            <div id="lcd">
              <div id="log"></div>
              <div id="menu" hidden></div>
              <div id="desc"></div>
            </div>

            <div id="keypad">
              <button data-cmd="fight"><i class="ic ic-fight"></i><span>FIGHT</span><em></em></button>
              <button data-cmd="skill"><i class="ic ic-skill"></i><span>SKILL</span><em></em></button>
              <button data-cmd="act"><i class="ic ic-act"></i><span>ACT</span><em></em></button>
              <button data-cmd="item"><i class="ic ic-item"></i><span>ITEM</span><em></em></button>
              <button data-cmd="mercy"><i class="ic ic-mercy"></i><span>MERCY</span><em></em></button>
            </div>
          </section>
        </div>

        <div id="screen"></div>
      </div>
    </div>

    <script src="js/images.js"></script>
    <script src="js/data.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/creature.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
