<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crispy vs The Creature</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="scene" width="1280" height="960"></canvas>

        <div id="hud">
          <header id="topbar">
            <span class="hazard" aria-hidden="true"></span>
            <span class="where">CHRIS'S LIVING ROOM · 2:47 AM</span>
            <span class="round" id="round">ROUND 01</span>
            <span class="spacer"></span>
            <button class="toggle" id="btn-music">MUSIC</button>
            <button class="toggle" id="btn-sfx">SOUND</button>
          </header>

          <section id="foe" class="box">
            <img id="foe-pic" alt="" />
            <div class="foe-info">
              <div class="foe-name"><span id="foe-name">The Creature</span> <span id="foe-tag">(Stage 1)</span></div>
              <div class="foe-state" id="foe-state">[GOOD]</div>
              <div class="timer" id="foe-timer"><i class="clock"></i><span>ADJUST IN</span><b id="foe-turns">3</b></div>
              <div class="tags" id="foe-tags"></div>
            </div>
          </section>

          <section id="me" class="box">
            <div class="portrait"><img id="me-pic" alt="Crispy" /></div>
            <div class="name"><b>CRISPY</b><span>LV 99 · SANITATION</span></div>
            <div class="vital">
              <i class="heart" id="heart"></i>
              <span class="hpword" id="hp-word">[OK]</span>
              <span class="num" id="hp-num">280/280</span>
            </div>
            <div class="bar hp"><i id="hp-fill"></i></div>
            <div class="vital sp"><span class="label">SP</span><span class="num" id="sp-num">100/100</span></div>
            <div class="bar sp"><i id="sp-fill"></i></div>
            <div class="pilot" id="pilot"><i class="flame"></i><span>PILOT LIGHT · WILLPOWER</span></div>
            <div class="tags" id="hero-tags"></div>
          </section>

          <section id="lcd" class="box">
            <div id="log"></div>
            <div id="menu" hidden></div>
            <div id="desc"></div>
          </section>

          <section id="keypad" class="box">
            <button data-cmd="fight"><i class="ptr"></i>FIGHT</button>
            <button data-cmd="skill"><i class="ptr"></i>SKILL</button>
            <button data-cmd="act"><i class="ptr"></i>ACT</button>
            <button data-cmd="item"><i class="ptr"></i>ITEM</button>
            <button data-cmd="mercy"><i class="ptr"></i>MERCY</button>
          </section>
        </div>

        <canvas id="fx" width="1280" height="960"></canvas>
        <div id="screen"></div>
      </div>
    </div>

    <script src="js/images.js"></script>
    <script src="js/data.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/creature.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
